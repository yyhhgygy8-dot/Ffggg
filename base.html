<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}WireGuard Auto Panel{% endblock %}</title><style>
body{font-family:Tahoma,Arial,sans-serif;background:#0b1220;color:#e5e7eb;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#111827;border:1px solid #253047;border-radius:14px;padding:16px;margin:14px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 10px;background:#0b1220;color:#fff;border:1px solid #334155;border-radius:8px}button,.btn{border:0;border-radius:8px;padding:9px 13px;background:#2563eb;color:white;text-decoration:none;cursor:pointer}.danger{background:#b91c1c}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #273449;text-align:right}.pill{padding:4px 8px;border-radius:20px;background:#172033;font-size:12px}.flash{background:#3f2a0b;padding:10px;border-radius:8px;margin:10px 0}.actions form{display:inline}.small{font-size:12px}.mono{font-family:monospace;direction:ltr;text-align:left}
</style></head><body><div class="wrap"><div class="top"><h2>WireGuard Real Auto Panel v2</h2>{% if session.get('logged_in') %}<a class="btn" href="{{url_for('logout')}}">خروج</a>{% endif %}</div>{% with ms=get_flashed_messages() %}{% for m in ms %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
